name: Publish & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish image
        uses: broadsheet-technology/publisher@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}
          tags: |
            ${{ github.sha }}
            ${{ steps.package.outputs.version }}
            latest

  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v0.1.2
        env:
          WORDPRESS_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{secrets.SSH_HOST}} # IP address of the server you wish to ssh into
          key: ${{secrets.SSH_KEY}} # Private or public key of the server
          username: ${{ secrets.SSH_USER}} # User of the server you want to ssh into
          envs: WORDPRESS_IMAGE,GHCR_USERNAME,GHCR_TOKEN
     
          script: |
            set -eu
            cd ~/wjh.dev
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker-compose pull wordpress
            docker-compose up -d --build
            echo 'Deployment successful to Digital Ocean' 
