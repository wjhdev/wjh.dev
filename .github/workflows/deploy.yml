name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tags:
        description: Optional newline- or comma-separated image tags to publish.
        required: false
        default: ""
      delete-tags:
        description: Optional newline- or comma-separated image tags to delete.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      deploy-tag: ${{ steps.publisher-inputs.outputs.deploy-tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Select publisher inputs
        id: publisher-inputs
        shell: bash
        env:
          INPUT_TAGS: ${{ github.event.inputs.tags }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            {
              echo "tags<<TAGS"
              echo "latest"
              echo "master"
              echo "sha-${GITHUB_SHA}"
              echo "TAGS"
              echo "deploy-tag=sha-${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<TAGS"
              printf "%s\n" "$INPUT_TAGS"
              echo "TAGS"
              echo "deploy-tag="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish image
        uses: ./.github/actions/publisher
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ steps.image.outputs.image }}
          tags: ${{ steps.publisher-inputs.outputs.tags }}
          delete-tags: ${{ github.event.inputs.delete-tags }}

  deploy:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v0.1.2
        env:
          WORDPRESS_IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.deploy-tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{secrets.SSH_HOST}} # IP address of the server you wish to ssh into
          key: ${{secrets.SSH_KEY}} # Private or public key of the server
          username: ${{ secrets.SSH_USER}} # User of the server you want to ssh into
          envs: WORDPRESS_IMAGE,GHCR_USERNAME,GHCR_TOKEN
     
          script: |
            set -eu
            cd ~/wjh.dev
            git fetch origin master
            git checkout -f master
            git reset --hard origin/master
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker-compose pull wordpress
            docker-compose up -d --build
            echo 'Deployment successful to Digital Ocean' 
